[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatbot-new"
version = "2.2.4"
description = "智能微信聊天机器人（基于 KouriChat 重构）：接入 DeepSeek/GPT/Gemini 大模型，拟人化角色扮演、记忆、情绪表情包、定时任务、联网搜索；兼容微信 4.1.12+，底层使用 wechatauto-replica"
readme = "readme.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["wechat", "weixin", "wechat-bot", "chatbot", "ai", "llm", "deepseek", "gpt", "kourichat", "roleplay", "automation", "wechatauto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "wechatauto-replica[guia]>=1.0.4",
    "flask",
    "werkzeug",
    "openai==1.84.0",
    "psutil",
    "filelock",
    "requests",
    "beautifulsoup4",
    "lxml",
]

[project.urls]
Homepage = "https://github.com/fanyuantaier/wechatbot-new"
Source = "https://github.com/fanyuantaier/wechatbot-new"
Issues = "https://github.com/fanyuantaier/wechatbot-new/issues"

[project.scripts]
wechatbot = "bot:main"
wechatbot-webui = "config_editor:main"

[tool.setuptools]
py-modules = ["bot", "config", "config_editor", "run", "test_bot", "wxbot"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["emojis*", "prompts*", "templates*", "Demo_Image*", "forum_data*"]

[tool.setuptools.package-data]
"*" = ["*", "*/*", "*/*/*", "*/*/*/*"]
